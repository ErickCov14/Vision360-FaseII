name: vision360-faseii
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - '8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: backend:8000
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
